name: distributed-workflow-orchestrator

services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: ${DB_NAME:-dwo}
      POSTGRES_USER: ${DB_USER:-dwo_user}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-dwo_password}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-dwo_user} -d ${DB_NAME:-dwo}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  redis:
    image: redis:8-alpine
    ports:
      - "${REDIS_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s

  migrate:
    build:
      context: ./backend
      dockerfile: Dockerfile.dev
    environment:
      DATABASE_URL: postgresql://${DB_USER:-dwo_user}:${DB_PASSWORD:-dwo_password}@postgres:5432/${DB_NAME:-dwo}
      REDIS_URL: redis://redis:6379/0
    command: ["sh", "-c", "echo 'Migration placeholder: TODO: Use Alembic' && exit 0"]
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: "no"

  api:
    build:
      context: ./backend
      dockerfile: Dockerfile.dev
    environment:
      DATABASE_URL: postgresql://${DB_USER:-dwo_user}:${DB_PASSWORD:-dwo_password}@postgres:5432/${DB_NAME:-dwo}
      REDIS_URL: redis://redis:6379/0
    command:
      [
        "sh",
        "-c",
        "python -m uvicorn backend.app:create_app --factory --host 0.0.0.0 --port ${API_PORT:-8000} --reload",
      ]
    volumes:
      - ./backend:/app
    ports:
      - "${API_PORT:-8000}:8000"
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8000/health"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

  worker:
    build:
      context: ./backend
      dockerfile: Dockerfile.dev
    environment:
      DATABASE_URL: postgresql://${DB_USER:-dwo_user}:${DB_PASSWORD:-dwo_password}@postgres:5432/${DB_NAME:-dwo}
      REDIS_URL: redis://redis:6379/0
    command:
      [
        "sh",
        "-c",
        "echo 'Worker placeholder: TODO: Use Celery' && tail -f /dev/null",
      ]
    volumes:
      - ./backend:/app
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.dev
    environment:
      FRONTEND_PORT: ${FRONTEND_PORT:-5173}
      VITE_API_BASE_URL: http://localhost:${API_PORT:-8000}
    command: ["sh", "-c", "npm run dev -- --host 0.0.0.0 --port ${FRONTEND_PORT:-5173}"]
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
    ports:
      - "${FRONTEND_PORT:-5173}:5173"
    depends_on:
      api:
        condition: service_healthy

volumes:
  postgres_data:
  frontend_node_modules:
