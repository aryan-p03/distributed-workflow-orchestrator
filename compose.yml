name: distributed-workflow-orchestrator

services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: ${DB_NAME:-dwo}
      POSTGRES_USER: ${DB_USER:-dwo_user}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-dwo_password}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-dwo_user} -d ${DB_NAME:-dwo}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  redis:
    image: redis:8-alpine
    ports:
      - "${REDIS_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s

  api:
    build:
      context: ./backend
      dockerfile: Dockerfile.dev
    environment:
      APP_ENV: ${APP_ENV:-development}
      DATABASE_URL: postgresql://${DB_USER:-dwo_user}:${DB_PASSWORD:-dwo_password}@postgres:5432/${DB_NAME:-dwo}
      REDIS_URL: redis://redis:6379/0
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      SCHEMA_SYNC_ON_STARTUP: ${SCHEMA_SYNC_ON_STARTUP:-true}
      CORS_ALLOW_ORIGINS: ${CORS_ALLOW_ORIGINS:-http://localhost:5173,http://127.0.0.1:5173}
      JWT_SECRET: ${JWT_SECRET:-change-me-in-production}
      JWT_EXPIRES_SECONDS: ${JWT_EXPIRES_SECONDS:-3600}
      TASK_RECOVERY_STALE_SECONDS: ${TASK_RECOVERY_STALE_SECONDS:-900}
    command:
      [
        "sh",
        "-c",
        "python -m uvicorn backend.app:create_app --factory --host 0.0.0.0 --port ${API_PORT:-8000} --reload",
      ]
    volumes:
      - ./backend:/app
    ports:
      - "${API_PORT:-8000}:8000"
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8000/health"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  worker:
    build:
      context: ./backend
      dockerfile: Dockerfile.dev
    environment:
      APP_ENV: ${APP_ENV:-development}
      DATABASE_URL: postgresql://${DB_USER:-dwo_user}:${DB_PASSWORD:-dwo_password}@postgres:5432/${DB_NAME:-dwo}
      REDIS_URL: redis://redis:6379/0
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      CELERY_LOG_LEVEL: ${CELERY_LOG_LEVEL:-INFO}
      TASK_RECOVERY_STALE_SECONDS: ${TASK_RECOVERY_STALE_SECONDS:-900}
    command:
      [
        "sh",
        "-c",
        "python -m celery -A backend.worker.celery_app:celery_app worker --loglevel=${CELERY_LOG_LEVEL:-INFO}",
      ]
    volumes:
      - ./backend:/app
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      api:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.dev
    environment:
      FRONTEND_PORT: ${FRONTEND_PORT:-5173}
      VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://localhost:${API_PORT:-8000}}
    command: ["sh", "-c", "npm run dev -- --host 0.0.0.0 --port ${FRONTEND_PORT:-5173}"]
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
    ports:
      - "${FRONTEND_PORT:-5173}:5173"
    depends_on:
      api:
        condition: service_healthy

volumes:
  postgres_data:
  frontend_node_modules:
