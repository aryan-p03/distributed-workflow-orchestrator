[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "backend"
version = "0.1.0"
description = "FastAPI backend for distributed workflow orchestration"
requires-python = ">=3.14"
dependencies = [
    "celery>=5.5.3",
    "fastapi>=0.136.3",
    "pydantic-settings>=2.11.0",
    "psycopg2-binary>=2.9.11",
    "redis>=6.4.0",
    "sqlalchemy>=2.0.43",
    "uvicorn>=0.48.0",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "mypy>=2.1.0",
    "pip-audit>=2.10.0",
    "pytest>=9.0.3",
    "pytest-cov>=7.1.0",
    "ruff>=0.15.14",
]

[tool.ruff]
line-length = 100
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.mypy]
python_version = "3.14"
strict = true

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
include = ["backend*"]

[tool.setuptools.package-data]
backend = ["py.typed"]
